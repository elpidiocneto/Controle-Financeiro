<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .botao-teste {
            padding: 20px;
            background: purple;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Teste de Clique</h1>
    
    <button class="botao-teste" id="btn1">BOTÃO 1 - COM CLASSNAME</button>
    <br><br>
    <button style="padding:20px;background:green;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px;" id="btn2">BOTÃO 2 - COM STYLE</button>
    <br><br>
    <button class="botao-teste" onclick="alert('Onclick HTML funciona!')">BOTÃO 3 - ONCLICK HTML</button>
    
    <div id="resultado"></div>
    
    <script>
        console.log('Script carregado');
        
        // Teste 1: addEventListener direto
        document.getElementById('btn1').addEventListener('click', function() {
            document.getElementById('resultado').innerHTML += '<p>✅ BOTÃO 1 FUNCIONOU!</p>';
            alert('Botão 1 com className funcionou!');
        });
        
        // Teste 2: addEventListener direto no style
        document.getElementById('btn2').addEventListener('click', function() {
            document.getElementById('resultado').innerHTML += '<p>✅ BOTÃO 2 FUNCIONOU!</p>';
            alert('Botão 2 com style funcionou!');
        });
        
        // Teste 3: Event listener global
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') {
                console.log('Clique detectado em botão:', e.target.id);
            }
        }, true);
        
        console.log('Event listeners instalados');
    </script>
</body>
</html>
